<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="medGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A8F6A" />
      <stop offset="100%" stop-color="#0369A1" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0A8F6A" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#medGrad)" />
  
  <!-- Subtle inner card -->
  <rect x="44" y="44" width="424" height="424" rx="90" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-opacity="0.25" stroke-width="3" />
  
  <!-- Medical Cross & Shield Graphic -->
  <g filter="url(#shadow)" transform="translate(256, 230)">
    <!-- Glowing circle -->
    <circle r="128" fill="#ffffff" />
    <!-- Medical Plus Cross -->
    <path d="M -30,-80 L 30,-80 L 30,-30 L 80,-30 L 80,30 L 30,30 L 30,80 L -30,80 L -30,30 L -80,30 L -80,-30 L -30,-30 Z" fill="#0A8F6A" rx="10" />
    <!-- Heartbeat accent -->
    <path d="M -50,0 L -25,0 L -12,-28 L 6,32 L 22,-14 L 32,0 L 50,0" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
  </g>
  
  <!-- Text VMH / Verma Medical -->
  <text x="256" y="420" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="34" fill="#ffffff" text-anchor="middle" letter-spacing="2">VERMA MEDICAL</text>
  <text x="256" y="450" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="600" font-size="16" fill="#A7F3D0" text-anchor="middle" letter-spacing="3">BIHAR SHARIF</text>
</svg>
